<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== Primary SEO ===== -->
    <title>Fathima Asma | Software Engineering Undergraduate | Portfolio</title>
    <meta
      name="description"
      content="Fathima Asma — Software Engineering Undergraduate seeking internship opportunities. Hands-on project experience in React, Node.js, and full-stack software development."
    />
    <meta
      name="keywords"
      content="Fathima Asma, Software Engineer, Software Engineering Undergraduate, SLIIT, React Developer, Full Stack Developer, Intern, Sri Lanka"
    />
    <meta name="author" content="Fathima Asma" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#F8F5F0" />

    <!-- ===== Open Graph ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fathima Asma Portfolio" />
    <meta property="og:title" content="Fathima Asma | Software Engineering Undergraduate" />
    <meta
      property="og:description"
      content="Software Engineering Undergraduate with hands-on project experience seeking internship opportunities. Explore my work and get in touch."
    />

    <!-- ===== Favicons ===== -->
    <link rel="icon" type="image/png" href="/src/assets/fathima-avatar.png" />

    <!-- ===== Google Fonts: Playfair Display & Plus Jakarta Sans ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ===== JSON-LD (SPA SEO) ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Fathima Asma",
        "jobTitle": "Software Engineering Undergraduate",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "Sri Lanka"
        },
        "description": "Software Engineering Undergraduate with hands-on project experience seeking internship opportunities."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
